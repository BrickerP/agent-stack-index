[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-stack-index"
version = "0.1.0"
description = "Measure which libraries and services AI coding agents pick, across models, prompts and context."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yupeng Lu" }]
dependencies = []

[project.scripts]
asi = "agent_stack_index.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
