# Model registry. To add a model: add a [models.<id>] table and run the experiments again; only the
# new trials execute. To retire one: set enabled = false (its history stays in data/ and releases).
# Base URLs and keys come from the environment variables named under [providers]; never put them here.

[providers.gateway]
kind = "openai_chat"            # openai_chat | openai_responses | anthropic_messages
base_url_env = "ASI_GATEWAY_BASE_URL"
api_key_env = "ASI_GATEWAY_API_KEY"
max_concurrency = 64
timeout_s = 300

[models.claude-opus-5-5]
provider = "gateway"
route = "Opus 5.5"
lab = "Anthropic"
label = "Claude Opus 5.5"
max_concurrency = 6
params = { max_tokens = 8000 }
notes = "Gateway route adds its own system prompt (~6.6k input tokens on an empty request)."

[models.claude-sonnet-5-5]
provider = "gateway"
route = "Claude Sonnet 5.5"
lab = "Anthropic"
label = "Claude Sonnet 5.5"
max_concurrency = 6
params = { max_tokens = 8000 }
notes = "Gateway route adds its own system prompt (~6.6k input tokens on an empty request)."

